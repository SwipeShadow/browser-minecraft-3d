<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxelCraft 3D</title>
  <style>
    :root {
      --bg: #0b1020;
      --hud: rgba(255, 255, 255, 0.9);
      --panel: rgba(16, 18, 28, 0.65);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#7ec9ff, #dff7ff);
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      opacity: 0.9;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 3px rgba(0,0,0,0.6);
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }

    #info {
      position: absolute;
      left: 18px;
      top: 18px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      pointer-events: none;
    }

    #info strong {
      color: #d8f2ff;
    }

    #start {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9, 12, 16, 0.35);
      backdrop-filter: blur(2px);
      color: white;
      text-align: center;
      z-index: 10;
      user-select: none;
      pointer-events: auto;
    }

    #start.hidden {
      display: none;
      pointer-events: none;
    }

    #startBox {
      background: rgba(13, 16, 22, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      pointer-events: auto;
    }

    #start h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
    }

    #start p {
      margin: 0;
      color: #dfefff;
      font-size: 16px;
      line-height: 1.5;
    }

    #startButton {
      margin-top: 18px;
      background: linear-gradient(180deg, #66d77d, #2c9d52);
      border: none;
      color: white;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 10px 28px rgba(50,170,90,0.35);
      pointer-events: auto;
      transition: all 0.2s ease;
    }

    #startButton:hover {
      background: linear-gradient(180deg, #7ae68a, #35ac5b);
      box-shadow: 0 12px 32px rgba(50,170,90,0.45);
    }

    #startButton:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>

    <div id="info">
      <strong>VoxelCraft 3D</strong><br>
      WASD = Move<br>
      Space = Jump<br>
      LMB = Break block<br>
      RMB = Place block
    </div>

    <div id="start">
      <div id="startBox">
        <h1>VoxelCraft 3D</h1>
        <p>Click to start and enter the world.</p>
        <button id="startButton">Play</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
    import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/PointerLockControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 18, 75);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 18, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    const ambient = new THREE.HemisphereLight(0xffffff, 0x3f4c5a, 1.2);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff4d6, 1.1);
    sun.position.set(12, 22, 10);
    scene.add(sun);

    const world = new Map();
    const worldMeshes = new Map();
    const blockGroup = new THREE.Group();
    scene.add(blockGroup);

    const BLOCK_TYPES = {
      grass: 0x64b75b,
      dirt: 0x7c4d2e,
      stone: 0x8a8a8a,
      sand: 0xe7d585,
      wood: 0x8b5a2b,
      leaves: 0x39a85d,
      bedrock: 0x444444
    };

    const selectedBlockType = "dirt";
    const keys = {};
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(0, 0);

    const player = {
      speed: 6.5,
      gravity: 24,
      velocityY: 0,
      onGround: false
    };

    const startOverlay = document.getElementById("start");
    const startButton = document.getElementById("startButton");
    let gameRunning = false;

    function keyFor(x, y, z) {
      return `${x},${y},${z}`;
    }

    function addBlock(x, y, z, type = "grass") {
      const key = keyFor(x, y, z);
      if (world.has(key)) return;

      const color = BLOCK_TYPES[type] ?? BLOCK_TYPES.grass;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.userData = { x, y, z, type };
      blockGroup.add(mesh);
      world.set(key, type);
      worldMeshes.set(key, mesh);
    }

    function removeBlock(x, y, z) {
      const key = keyFor(x, y, z);
      const mesh = worldMeshes.get(key);
      if (!mesh) return;
      blockGroup.remove(mesh);
      world.delete(key);
      worldMeshes.delete(key);
    }

    function canPlaceAt(x, y, z) {
      const key = keyFor(x, y, z);
      if (world.has(key)) return false;
      const dist = new THREE.Vector3(x + 0.5, y + 0.5, z + 0.5).distanceTo(camera.position);
      return dist > 2.2;
    }

    function collidesAt(position) {
      const eyeY = position.y;
      const feetY = eyeY - 1.7;

      const minX = Math.floor(position.x - 0.35);
      const maxX = Math.floor(position.x + 0.35);
      const minY = Math.floor(feetY - 0.15);
      const maxY = Math.floor(position.y + 0.35);
      const minZ = Math.floor(position.z - 0.35);
      const maxZ = Math.floor(position.z + 0.35);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (world.has(keyFor(x, y, z))) return true;
          }
        }
      }
      return false;
    }

    function generateWorld() {
      const radius = 12;

      for (let x = -radius; x <= radius; x++) {
        for (let z = -radius; z <= radius; z++) {
          const hill = 2 + Math.floor(Math.sin(x * 0.75 + z * 0.35) * 1.5 + Math.cos(z * 0.8) * 1.2);
          const surfaceY = hill;

          for (let y = -2; y <= surfaceY; y++) {
            if (y === -2) {
              addBlock(x, y, z, "bedrock");
            } else if (y === surfaceY) {
              addBlock(x, y, z, "grass");
            } else if (y >= surfaceY - 2) {
              addBlock(x, y, z, "dirt");
            } else {
              addBlock(x, y, z, "stone");
            }
          }

          const treeChance = Math.random();
          if (treeChance > 0.975 && surfaceY > 1) {
            const trunkHeight = 3 + Math.floor(Math.random() * 2);
            for (let t = 1; t <= trunkHeight; t++) {
              addBlock(x, surfaceY + t, z, "wood");
            }

            for (let lx = -2; lx <= 2; lx++) {
              for (let lz = -2; lz <= 2; lz++) {
                for (let ly = 0; ly <= 2; ly++) {
                  const dx = Math.abs(lx);
                  const dz = Math.abs(lz);
                  const dist = dx + dz + Math.abs(ly - 1);
                  if (dist <= 4 && !(lx === 0 && lz === 0 && ly === 0)) {
                    addBlock(x + lx, surfaceY + trunkHeight - 1 + ly, z + lz, "leaves");
                  }
                }
              }
            }
          }
        }
      }
    }

    function updatePlayer(dt) {
      if (keys["KeyW"]) controls.moveForward(player.speed * dt);
      if (keys["KeyS"]) controls.moveForward(-player.speed * dt);
      if (keys["KeyA"]) controls.moveRight(-player.speed * dt);
      if (keys["KeyD"]) controls.moveRight(player.speed * dt);

      const oldPos = camera.position.clone();
      if (collidesAt(camera.position)) {
        camera.position.copy(oldPos);
      }

      if (keys["Space"] && player.onGround) {
        player.velocityY = 8.2;
        player.onGround = false;
      }

      player.velocityY -= player.gravity * dt;
      const nextY = camera.position.y + player.velocityY * dt;
      const oldY = camera.position.y;
      camera.position.y = nextY;

      if (collidesAt(camera.position)) {
        camera.position.y = oldY;
        player.velocityY = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    }

    function startGame() {
      startOverlay.classList.add("hidden");
      gameRunning = true;
      controls.lock();
    }

    function handleBreakOrPlace(event) {
      if (!gameRunning || document.pointerLockElement !== document.body) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(blockGroup.children, false);

      if (intersects.length === 0) return;

      const hit = intersects[0];
      const { x, y, z } = hit.object.userData;
      const normal = hit.face.normal.clone();
      normal.applyQuaternion(hit.object.quaternion);

      if (event.button === 0) {
        removeBlock(x, y, z);
      } else if (event.button === 2) {
        const placeX = x + Math.round(normal.x);
        const placeY = y + Math.round(normal.y);
        const placeZ = z + Math.round(normal.z);
        if (canPlaceAt(placeX, placeY, placeZ)) {
          addBlock(placeX, placeY, placeZ, selectedBlockType);
        }
      }
    }

    startButton.addEventListener("click", startGame);

    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    document.addEventListener("mousedown", (event) => {
      if (!gameRunning) return;
      if (event.button === 0 || event.button === 2) {
        event.preventDefault();
        handleBreakOrPlace(event);
      }
    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    generateWorld();

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.016);
      lastTime = now;

      if (gameRunning) {
        updatePlayer(dt);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
