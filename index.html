<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxelCraft 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: white;
    }
    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    #crosshair::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }
    #info {
      position: absolute;
      left: 18px;
      top: 18px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    #health {
      position: absolute;
      left: 18px;
      bottom: 18px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
    }
    .bar {
      width: 100px;
      height: 8px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }
    .fill {
      height: 100%;
      background: #ff4444;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="info">
      <strong>VoxelCraft 3D</strong><br>
      WASD = Move | SPACE = Jump<br>
      LMB = Break | RMB = Place<br>
      ESC = Pause | Click = Lock Mouse
    </div>
    <div id="health">
      <span>Health</span>
      <div class="bar"><div class="fill" id="healthBar"></div></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js";
    import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@r128/examples/jsm/controls/PointerLockControls.js";

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    // Lighting
    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    scene.add(light);

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(100, 100, 50);
    scene.add(sun);

    // World data
    const world = new Map();
    const meshes = new Map();
    const blocks = new THREE.Group();
    scene.add(blocks);

    const colors = {
      grass: 0x2d5016,
      dirt: 0x8b6914,
      stone: 0x808080,
      sand: 0xdaa520,
      wood: 0x654321,
      leaves: 0x228b22
    };

    // Player
    const player = {
      speed: 0.1,
      gravity: 0.15,
      velocityY: 0,
      onGround: false,
      health: 20
    };

    const keys = {};
    let selectedBlock = "dirt";

    function key(x, y, z) {
      return `${x},${y},${z}`;
    }

    function addBlock(x, y, z, type = "grass") {
      const k = key(x, y, z);
      if (world.has(k)) return;

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshPhongMaterial({ color: colors[type] || 0x808080 })
      );
      mesh.position.set(x, y, z);
      mesh.userData = { x, y, z, type };
      blocks.add(mesh);

      world.set(k, type);
      meshes.set(k, mesh);
    }

    function removeBlock(x, y, z) {
      const k = key(x, y, z);
      const mesh = meshes.get(k);
      if (!mesh) return;
      blocks.remove(mesh);
      world.delete(k);
      meshes.delete(k);
    }

    function canCollide(x, y, z) {
      return world.has(key(Math.floor(x), Math.floor(y), Math.floor(z)));
    }

    // World generation
    function generateWorld() {
      for (let x = -20; x <= 20; x++) {
        for (let z = -20; z <= 20; z++) {
          const height = 10 + Math.sin(x * 0.3) * 3 + Math.cos(z * 0.3) * 2;
          for (let y = 0; y < height; y++) {
            let type = "stone";
            if (y === Math.floor(height) - 1) type = "grass";
            else if (y >= Math.floor(height) - 3) type = "dirt";
            addBlock(x, y, z, type);
          }
        }
      }
    }

    function updatePlayer(dt) {
      if (keys["w"]) controls.moveForward(player.speed);
      if (keys["s"]) controls.moveForward(-player.speed);
      if (keys["a"]) controls.moveRight(-player.speed);
      if (keys["d"]) controls.moveRight(player.speed);

      player.velocityY -= player.gravity;
      camera.position.y += player.velocityY;

      if (canCollide(camera.position.x, camera.position.y - 1, camera.position.z)) {
        camera.position.y = Math.floor(camera.position.y) + 1.6;
        player.velocityY = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      if (keys[" "] && player.onGround) {
        player.velocityY = 0.3;
        player.onGround = false;
      }
    }

    function breakBlock() {
      const origin = camera.position.clone();
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      
      for (let i = 0; i < 100; i++) {
        const pos = origin.clone().addScaledVector(dir, i * 0.1);
        const x = Math.floor(pos.x);
        const y = Math.floor(pos.y);
        const z = Math.floor(pos.z);
        if (world.has(key(x, y, z))) {
          removeBlock(x, y, z);
          return;
        }
      }
    }

    function placeBlock() {
      const origin = camera.position.clone();
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      
      for (let i = 0; i < 100; i++) {
        const pos = origin.clone().addScaledVector(dir, i * 0.1);
        const x = Math.floor(pos.x);
        const y = Math.floor(pos.y);
        const z = Math.floor(pos.z);
        if (world.has(key(x, y, z))) {
          const k = key(x + Math.sign(pos.x - x), y, z + Math.sign(pos.z - z));
          if (!world.has(k)) {
            addBlock(x + Math.sign(pos.x - x), y, z + Math.sign(pos.z - z), selectedBlock);
          }
          return;
        }
      }
    }

    // Events
    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (["w", "a", "s", "d", " "].includes(key)) {
        keys[key] = true;
      }
      if (e.key === "Escape") {
        if (document.pointerLockElement) document.exitPointerLock();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    document.addEventListener("click", () => {
      if (!document.pointerLockElement) {
        controls.lock();
      }
    });

    document.addEventListener("mousedown", (e) => {
      if (document.pointerLockElement !== document.body) return;
      if (e.button === 0) breakBlock();
      if (e.button === 2) placeBlock();
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Generate and start
    generateWorld();

    let lastTime = Date.now();
    function animate() {
      requestAnimationFrame(animate);

      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      updatePlayer(dt);
      document.getElementById("healthBar").style.width = (player.health / 20) * 100 + "%";

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
